name: Rename portfolio file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "SanthoshKumar020"
          git config user.email "SanthoshKumar020@users.noreply.github.com"
          git mv santhoshkumar-portfolio.html index.html
          git commit -m "Rename to index.html"
          git push
